<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진실의 거울 | 도파#</title>
<meta name="description" content="거울아 거울아, 세상에서 누가 제일…? 질문하면 진실의 거울이 답을 비춰주는 장난 웹게임.">
<meta name="dopasharp:game" content="truth-mirror">
<link rel="canonical" href="https://dopasharp.github.io/truth-mirror/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="도파# dopa.shap">
<meta property="og:title" content="진실의 거울 🪞">
<meta property="og:description" content="거울아 거울아, 세상에서 가장 예쁜 사람은 누구니? 거울은 절대 거짓말을 하지 않는다…">
<meta property="og:url" content="https://dopasharp.github.io/truth-mirror/">
<meta property="og:image" content="https://dopasharp.github.io/truth-mirror/og/mirror.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">

<script src="dopasharp/dopasharp.js" defer></script>
<style>
  /* The mirror keeps its own mystic purple and gold inside the 도파# frame; Nanum Myeongjo is the mirror's voice. */
  :root {
    --bg: #0d0716;
    --bg2: #2a1450;
    --gold1: #fff3b0;
    --gold2: #e6b84a;
    --gold3: #8a5a12;
    --text: #f6ecff;
    --muted: #b9a6d6;
    --glow: rgba(199, 155, 255, .85);
    --evil: #ff3b5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 30%, var(--bg2) 0%, var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x: hidden;
    word-break: keep-all;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- 배경 별 ---------- */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .2;
    animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--delay);
  }
  @keyframes twinkle { 50% { opacity: 1; transform: scale(1.7); } }

  /* ---------- 레이아웃 ---------- */
  main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    min-height: 100dvh; max-width: 480px; margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main > .dopa-header { width: 100%; }
  .titlebar { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  h1 {
    font-family: 'Nanum Myeongjo', serif; font-weight: 800;
    font-size: clamp(26px, 7.5vw, 36px); letter-spacing: .12em;
    background: linear-gradient(180deg, var(--gold1), var(--gold2) 55%, var(--gold3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(230, 184, 74, .35));
  }
  .sound {
    position: absolute; right: 0; bottom: 0;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(230, 184, 74, .4);
    background: rgba(255, 255, 255, .05); font-size: 18px; cursor: pointer;
  }

  .asked {
    min-height: 3em; text-align: center; font-family: 'Nanum Myeongjo', serif; font-weight: 700;
    font-size: clamp(15px, 4.3vw, 18px); line-height: 1.5; color: #e9dbff;
    text-shadow: 0 0 12px var(--glow);
    display: flex; align-items: center; justify-content: center; padding: 0 8px;
  }
  body[data-view="idle"] .asked { visibility: hidden; }

  /* ---------- 거울 ---------- */
  .mirror-wrap { position: relative; width: min(74vw, 330px); aspect-ratio: 3 / 4; margin-top: 18px; }
  .crest {
    position: absolute; left: 50%; top: -30px; transform: translateX(-50%); z-index: 3;
    width: 74px; height: 46px;
  }
  .frame {
    position: absolute; inset: 0; border-radius: 50%; padding: 14px;
    background: conic-gradient(from 20deg, var(--gold3), var(--gold1), var(--gold2), var(--gold3), var(--gold1), var(--gold2), var(--gold3), var(--gold1), var(--gold3));
    box-shadow: 0 0 0 3px #5a3a08, 0 0 0 7px rgba(230, 184, 74, .25), 0 0 50px rgba(230, 184, 74, .3), 0 24px 60px rgba(0, 0, 0, .65);
  }
  .glass {
    position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; isolation: isolate;
    background: radial-gradient(ellipse at 40% 30%, #3a2a5c, #120a22 72%);
    box-shadow: inset 0 0 0 4px #5a3a08, inset 0 0 40px rgba(0, 0, 0, .85);
    transform: translateZ(0);
  }
  .glass video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); opacity: 0; filter: blur(14px) saturate(.5);
    transition: opacity 1.2s ease, filter 1.4s ease;
  }
  .glass.reveal video { opacity: 1; filter: none; }

  .mist {
    position: absolute; inset: -25%; z-index: 1;
    background:
      radial-gradient(circle at 30% 40%, rgba(199, 155, 255, .38), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(120, 180, 255, .3), transparent 45%),
      radial-gradient(circle at 50% 82%, rgba(255, 190, 255, .28), transparent 40%);
    animation: swirl 14s linear infinite; transition: opacity 1s;
  }
  .glass.thinking .mist { animation-duration: 2.2s; }
  .glass.evil.thinking .mist {
    background:
      radial-gradient(circle at 30% 40%, rgba(255, 60, 90, .35), transparent 40%),
      radial-gradient(circle at 70% 60%, rgba(140, 60, 200, .35), transparent 45%),
      radial-gradient(circle at 50% 82%, rgba(255, 90, 60, .25), transparent 40%);
  }
  .glass.reveal .mist { opacity: 0; }
  @keyframes swirl { to { transform: rotate(360deg); } }

  .spirit {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 14%; transition: opacity .8s;
  }
  .eyes { display: flex; gap: 38px; }
  .eye {
    width: 28px; height: 12px; border-radius: 50%; background: #efe4ff;
    box-shadow: 0 0 18px 6px var(--glow); animation: blink 5s infinite;
  }
  .mouth {
    margin-top: 34px; width: 42px; height: 6px; border-radius: 6px; background: #efe4ff;
    box-shadow: 0 0 14px 4px var(--glow);
  }
  .glass.talking .mouth { animation: talk .22s infinite alternate; }
  .glass.evil .eye, .glass.evil .mouth { background: #ffd6dc; box-shadow: 0 0 18px 6px rgba(255, 59, 92, .85); }
  .glass.evil .eye { height: 9px; border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%; }
  .glass.reveal .spirit { opacity: 0; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes talk { to { height: 16px; border-radius: 50%; } }

  .msg {
    position: absolute; left: 14%; right: 14%; bottom: 17%; z-index: 3;
    text-align: center; font-family: 'Nanum Myeongjo', serif; font-weight: 700;
    font-size: clamp(14px, 4vw, 17px); line-height: 1.5; color: #f3eaff;
    text-shadow: 0 0 10px var(--glow), 0 0 2px #000; transition: opacity .3s;
  }
  .vignette {
    position: absolute; inset: 0; z-index: 4; opacity: 0; pointer-events: none; transition: opacity 1.2s;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 60, .6));
  }
  .glass.evil.reveal .vignette { opacity: 1; }
  .glass.evil.reveal { animation: shake .45s 2 .2s; }
  @keyframes shake {
    20% { transform: translate(-6px, 2px) rotate(-1deg); }
    40% { transform: translate(5px, -3px) rotate(1deg); }
    60% { transform: translate(-4px, 3px); }
    80% { transform: translate(3px, -2px); }
  }
  .shine {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .16) 44%, transparent 56%);
  }
  .flash { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; }
  .glass.flashing .flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- 정답 ---------- */
  .answer { text-align: center; margin-top: 6px; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
  .answer-main {
    font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: clamp(30px, 9vw, 42px);
    background: linear-gradient(180deg, var(--gold1), var(--gold2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(230, 184, 74, .5));
  }
  .answer.evil .answer-main {
    background: linear-gradient(180deg, #ffd0d8, var(--evil));
    -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 0 14px rgba(255, 59, 92, .55));
  }
  .answer-sub { margin-top: 6px; color: var(--muted); font-size: var(--text-body); line-height: var(--leading-body); }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }

  /* ---------- 질문 / 버튼 ---------- */
  .questions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .btn {
    min-height: var(--button-height); padding: 10px 12px; border-radius: var(--radius-md); cursor: pointer;
    border: 1px solid rgba(230, 184, 74, .45);
    background: linear-gradient(180deg, rgba(120, 80, 190, .35), rgba(40, 20, 80, .55));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 6px 18px rgba(0, 0, 0, .35);
    font-size: 15px; font-weight: 600; line-height: 1.3; transition: transform var(--duration-fast), background var(--duration-normal);
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible, .sound:focus-visible, .intro-wake:focus-visible { outline: 3px solid var(--color-text); outline-offset: 3px; }
  .btn.gold {
    border-color: transparent; color: #2b1800; font-weight: 700;
    background: linear-gradient(180deg, var(--gold1), var(--gold2));
  }
  .custom { width: 100%; display: flex; gap: 8px; }
  .custom input {
    flex: 1; min-width: 0; min-height: var(--button-height); padding: 0 14px; border-radius: var(--radius-md);
    border: 1px solid rgba(230, 184, 74, .35); background: rgba(255, 255, 255, .06); font-size: 16px;
    -webkit-user-select: text; user-select: text;
  }
  .custom input::placeholder { color: rgba(185, 166, 214, .7); }
  .custom input:focus { outline: 2px solid var(--gold2); outline-offset: 1px; }
  .custom .btn { padding: 0 18px; }
  .after { width: 100%; margin-top: 4px; }
  .hint { color: var(--muted); font-size: var(--text-small); text-align: center; }
  .more { width: 100%; text-align: center; }

  body:not([data-view="idle"]) .idle-only { display: none !important; }
  body:not([data-view="done"]) .done-only { display: none !important; }

  /* ---------- 시작 화면 ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 20px 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(42, 20, 80, .97), rgba(13, 7, 22, .99));
    transition: opacity .6s;
  }
  .intro.hide { opacity: 0; pointer-events: none; }
  .intro-wake {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px 0; text-align: center; cursor: pointer; border: none; background: none; border-radius: var(--radius-xl);
  }
  .intro-wake .dopa-label { color: var(--gold2); }
  .intro-wake .dopa-button { margin-top: 6px; min-width: 220px; }
  .intro-icon { font-size: 76px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 0 24px var(--glow)); }
  .intro-title { display: block; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: var(--text-h1); line-height: var(--leading-tight); color: var(--gold1); letter-spacing: .06em; }
  .intro-copy { display: block; color: var(--muted); line-height: var(--leading-body); }
  .intro small { color: var(--muted); font-size: var(--text-small); max-width: 300px; line-height: 1.5; }
  @keyframes float { 50% { transform: translateY(-10px); } }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---------- 이모지 비 / 토스트 ---------- */
  .drop { position: fixed; top: -60px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(calc(100dvh + 120px)) rotate(var(--r)); } }
  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 40;
    transform: translate(-50%, 20px); opacity: 0; transition: .3s;
    background: rgba(20, 10, 36, .92); border: 1px solid rgba(230, 184, 74, .4);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .mist, .star, .intro-icon, .eye, .answer { animation: none !important; }
    .glass.evil.reveal { animation: none; }
  }
</style>
</head>
<body data-view="idle">
<div class="stars" aria-hidden="true"></div>

<div class="intro" id="intro">
  <header data-dopa="header"></header>
  <button class="intro-wake" id="introWake" type="button">
    <span class="dopa-label">MYSTIC CAMERA GAME</span>
    <span class="intro-icon" aria-hidden="true">🪞</span>
    <span class="intro-title">진실의 거울</span>
    <span class="intro-copy">이 거울은 절대<br>거짓말을 하지 않는다…</span>
    <span class="dopa-button" id="introTap">거울 깨우기</span>
    <small>🔊 플레이 중 소리가 날 수 있어요 ·카메라 영상은 어디에도 저장되지 않아요</small>
  </button>
  <footer data-dopa="footer"></footer>
</div>

<main>
  <header data-dopa="header"></header>
  <div class="titlebar">
    <h1>진실의 거울</h1>
    <button class="sound" id="sound" type="button" aria-label="소리 끄기">🔊</button>
  </div>

  <div class="mirror-wrap">
    <svg class="crest" viewBox="0 0 74 46" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff3b0"/><stop offset=".6" stop-color="#e6b84a"/><stop offset="1" stop-color="#8a5a12"/>
        </linearGradient>
        <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f2d6ff"/><stop offset=".5" stop-color="#9b4dff"/><stop offset="1" stop-color="#3b0f7a"/>
        </linearGradient>
      </defs>
      <path d="M4 40 C10 22 22 30 26 18 C29 8 33 4 37 2 C41 4 45 8 48 18 C52 30 64 22 70 40 Z" fill="url(#g)" stroke="#5a3a08" stroke-width="1.5"/>
      <path d="M37 12 L45 24 L37 36 L29 24 Z" fill="url(#gem)" stroke="#5a3a08" stroke-width="1.2"/>
      <circle cx="14" cy="34" r="3" fill="url(#gem)"/><circle cx="60" cy="34" r="3" fill="url(#gem)"/>
    </svg>
    <div class="frame">
      <div class="glass" id="glass">
        <video id="video" autoplay playsinline muted></video>
        <div class="mist"></div>
        <div class="spirit" aria-hidden="true">
          <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
          <div class="mouth"></div>
        </div>
        <p class="msg" id="msg" aria-live="polite">무엇이 궁금하냐…</p>
        <div class="vignette"></div>
        <div class="shine"></div>
        <div class="flash"></div>
      </div>
    </div>
  </div>

  <p class="asked" id="asked"></p>

  <section class="answer done-only" id="answer">
    <p class="answer-main" id="answerMain"></p>
    <p class="answer-sub" id="answerSub"></p>
  </section>

  <div class="questions idle-only" id="questions"></div>

  <form class="custom idle-only" id="custom" autocomplete="off">
    <input id="customInput" maxlength="40" placeholder="직접 물어보기 (예: 가장 똑똑한 사람은?)" enterkeyhint="send">
    <button class="btn gold" type="submit">묻기</button>
  </form>

  <div class="after dopa-actions done-only">
    <button class="dopa-button" id="saveBtn" type="button">📸 거울 사진 저장</button>
    <button class="dopa-button dopa-button--secondary" id="againBtn" type="button">다시 묻기</button>
    <button class="dopa-button dopa-button--secondary" id="linkBtn" type="button">링크 공유</button>
    <button class="dopa-button dopa-button--secondary dopa-button--wide dopa-challenge" id="shareBtn" type="button">😈 친구도 당하게 하기</button>
  </div>
  <div class="more done-only"><button class="dopa-button dopa-button--tertiary" type="button" data-dopa-more>다른 도파# 게임 보기</button></div>

  <p class="hint idle-only">"거울아 거울아…" 질문을 골라보세요</p>
  <footer data-dopa="footer"></footer>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
const QUESTIONS = [
  { btn: '💰 가장 부자는?',     ask: '세상에서 가장 부자는 누구니?',     answer: '바로 너!',     sub: '(통장 잔고는 못 본 걸로 할게…)', rain: ['💰', '💎', '💸'], mood: 'good' },
  { btn: '✨ 가장 예쁜 사람은?', ask: '세상에서 가장 예쁜 사람은 누구니?', answer: '바로 너야!',   sub: '거울인 나도 눈이 부셔…',        rain: ['✨', '🌸', '💖'], mood: 'good' },
  { btn: '🐣 가장 귀여운 건?',   ask: '세상에서 가장 귀여운 건 누구니?',   answer: '너지 뭐~',     sub: '귀여움 측정기가 고장났어',       rain: ['🐣', '🐰', '💕'], mood: 'good' },
  { btn: '👹 가장 못생긴 건?',   ask: '세상에서 가장 못생긴 건 누구니?',   answer: '…바로 너!',    sub: '미안, 거울은 거짓말을 못 해 😈', rain: ['💩', '🤡', '👻'], mood: 'evil' },
];
const THINKING = {
  good: ['흐음…', '온 세상을 비춰보는 중…', '모든 사람을 살펴봤다…', '찾았다…!'],
  evil: ['흐음…', '정말… 알고 싶어?', '후회해도 모른다…', '찾았다…!'],
};
const EVIL_WORDS = /못생|못난|바보|멍청|찌질|돼지|냄새|최악|이상한|싫|나쁜|게으른|뚱뚱|대머리|변태/;

const $ = (s) => document.querySelector(s);
const glass = $('#glass'), video = $('#video'), msg = $('#msg');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let stream = null, busy = false, current = null, soundOn = true, ac = null;

/* ---------- 별 ---------- */
(() => {
  const box = $('.stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('i');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--d', 2 + Math.random() * 4 + 's');
    s.style.setProperty('--delay', -Math.random() * 6 + 's');
    box.appendChild(s);
  }
})();

/* ---------- 질문 버튼 ---------- */
QUESTIONS.forEach((q) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = q.btn;
  b.onclick = () => ask(q);
  $('#questions').appendChild(b);
});

$('#custom').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('#customInput');
  let text = input.value.trim();
  if (!text) { input.focus(); return; }
  if (!/[?？]$/.test(text)) text += '?';
  input.value = '';
  input.blur();
  const evil = EVIL_WORDS.test(text);
  ask(evil
    ? { ask: text, answer: '…바로 너!', sub: '미안, 거울은 거짓말을 못 해 😈', rain: ['💩', '🤡', '👻'], mood: 'evil' }
    : { ask: text, answer: pick(['바로 너야!', '당연히 너지!', '두말하면 입 아파, 너!']), sub: '거울은 거짓말을 못 해 ✨', rain: ['✨', '💖', '⭐'], mood: 'good' });
});

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ---------- 시작: 카메라 켜기 ---------- */
$('#introWake').addEventListener('click', async () => {
  const intro = $('#intro');
  if (intro.dataset.busy) return;
  intro.dataset.busy = '1';
  $('#introTap').textContent = '거울이 깨어나는 중…';
  ensureAudio();
  // 권한 창이 오래 떠 있어도 일단 진행 (나중에 허용되면 그때 연결됨)
  const ok = await Promise.race([startCamera(), wait(8000).then(() => 'pending')]);
  intro.classList.add('hide');
  setTimeout(() => intro.remove(), 700);
  if (!ok) toast('카메라를 허용하지 않으면 진실을 비출 수 없어… 🥲');
});

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) return false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1440 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play().catch(() => {});
    return true;
  } catch (err) {
    console.warn('camera:', err);
    return false;
  }
}

/* ---------- 질문하기 ---------- */
async function ask(q) {
  if (busy) return;
  busy = true;
  current = q;
  ensureAudio();
  window.DopaSharp?.track('game_start', { mood: q.mood, custom: !q.btn });
  document.body.dataset.view = 'asking';
  $('#asked').textContent = `“거울아 거울아, ${q.ask}”`;
  glass.className = 'glass thinking talking' + (q.mood === 'evil' ? ' evil' : '');
  speak(`거울아 거울아, ${q.ask}`);
  hum(q.mood);

  for (const line of THINKING[q.mood]) {
    await showMsg(line);
    await wait(1150);
  }

  glass.classList.remove('talking');
  glass.classList.add('flashing');
  playReveal(q.mood);
  await wait(140);
  glass.classList.remove('thinking');
  glass.classList.add('reveal');
  await showMsg(stream ? '' : '(카메라가 꺼져 있어서\n얼굴을 비출 수 없어…)');

  const answer = $('#answer');
  answer.classList.toggle('evil', q.mood === 'evil');
  $('#answerMain').textContent = q.answer;
  $('#answerSub').textContent = q.sub;
  document.body.dataset.view = 'done';
  answer.style.animation = 'none'; answer.offsetHeight; answer.style.animation = '';
  rain(q.rain);
  window.DopaSharp?.track('game_complete', { mood: q.mood, camera: !!stream });
  speak(`${q.answer.replace(/…/g, '')} ${q.sub.replace(/[()]/g, '')}`);
  await wait(1000);
  glass.classList.remove('flashing');
  busy = false;
}

async function showMsg(text) {
  msg.style.opacity = 0;
  await wait(250);
  msg.innerText = text;
  msg.style.opacity = 1;
}

function reset() {
  if (busy) return;
  speechSynthesis?.cancel?.();
  glass.className = 'glass';
  document.body.dataset.view = 'idle';
  $('#asked').textContent = '';
  showMsg('무엇이 궁금하냐…');
}
$('#againBtn').onclick = () => { window.DopaSharp?.track('game_retry'); reset(); };

/* ---------- 소리 ---------- */
$('#sound').onclick = () => {
  soundOn = !soundOn;
  $('#sound').textContent = soundOn ? '🔊' : '🔇';
  $('#sound').setAttribute('aria-label', soundOn ? '소리 끄기' : '소리 켜기');
  if (!soundOn) speechSynthesis?.cancel?.();
};

function speak(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.9;
  u.pitch = 0.6;
  const voice = speechSynthesis.getVoices().find((v) => v.lang?.toLowerCase().startsWith('ko'));
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function ensureAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  // iOS: 무음 모드에서도 효과음이 나도록 (iOS 17+ Safari)
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
  if (!ac && AC) ac = new AC();
  if (ac?.state === 'suspended') ac.resume();
}

function tone(freq, start, dur, type = 'sine', gain = 0.12) {
  const t = ac.currentTime + start;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}

function hum(mood) {
  if (!soundOn || !ac) return;
  const base = mood === 'evil' ? 98 : 196;
  [0, 1.2, 2.4, 3.6].forEach((s, i) => tone(base * (i % 2 ? 1.5 : 1), s, 1.4, 'sine', 0.05));
}

function playReveal(mood) {
  if (!soundOn || !ac) return;
  if (mood === 'evil') {
    [233, 220, 208, 196, 98].forEach((f, i) => tone(f, i * 0.16, 0.6, 'sawtooth', 0.06));
  } else {
    [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * 0.08, 1.1, 'triangle', 0.1));
  }
}

/* ---------- 이모지 비 ---------- */
function rain(emojis) {
  if (reduceMotion) return;
  for (let i = 0; i < 36; i++) {
    const e = document.createElement('span');
    e.className = 'drop';
    e.textContent = emojis[i % emojis.length];
    e.style.left = Math.random() * 100 + 'vw';
    e.style.fontSize = 18 + Math.random() * 24 + 'px';
    e.style.animationDuration = 2.6 + Math.random() * 2.4 + 's';
    e.style.animationDelay = Math.random() * 1.4 + 's';
    e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    e.addEventListener('animationend', () => e.remove());
    document.body.appendChild(e);
  }
}

/* ---------- 토스트 ---------- */
let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 사진 저장 ---------- */
$('#saveBtn').onclick = async () => {
  if (!current) return;
  window.DopaSharp?.track('share_click', { method: 'photo' });
  const blob = await capture(current);
  const file = new File([blob], '진실의거울.png', { type: 'image/png' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '진실의 거울' }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('사진을 저장했어요 📸');
};

function fitFont(ctx, text, weight, family, size, maxW) {
  do { ctx.font = `${weight} ${size}px ${family}`; size -= 2; } while (ctx.measureText(text).width > maxW && size > 18);
}

async function capture(q) {
  await document.fonts.ready;
  const W = 1080, H = 1440, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const evil = q.mood === 'evil';

  const bg = x.createRadialGradient(W / 2, H * 0.4, 60, W / 2, H * 0.45, H * 0.85);
  bg.addColorStop(0, evil ? '#4a1030' : '#2a1450');
  bg.addColorStop(1, '#0d0716');
  x.fillStyle = bg;
  x.fillRect(0, 0, W, H);
  for (let i = 0; i < 90; i++) {
    x.fillStyle = `rgba(255,255,255,${Math.random() * 0.6 + 0.1})`;
    x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 2 + 0.5, 0, Math.PI * 2); x.fill();
  }

  const gold = x.createLinearGradient(0, 0, 0, H);
  gold.addColorStop(0, '#fff3b0'); gold.addColorStop(0.5, '#e6b84a'); gold.addColorStop(1, '#8a5a12');
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillStyle = '#e6b84a';
  x.font = '800 64px "Nanum Myeongjo", serif';
  x.fillText('진실의 거울', W / 2, 100);
  x.fillStyle = '#e9dbff';
  const asked = `“거울아 거울아, ${q.ask}”`;
  fitFont(x, asked, 700, '"Nanum Myeongjo", serif', 40, W - 120);
  x.fillText(asked, W / 2, 180);

  const cx = W / 2, cy = 700, rx = 330, ry = 440;
  // 금테
  const ring = x.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
  ring.addColorStop(0, '#8a5a12'); ring.addColorStop(0.25, '#fff3b0'); ring.addColorStop(0.5, '#e6b84a');
  ring.addColorStop(0.75, '#fff3b0'); ring.addColorStop(1, '#8a5a12');
  x.save();
  x.shadowColor = evil ? 'rgba(255,59,92,.6)' : 'rgba(230,184,74,.5)';
  x.shadowBlur = 60;
  x.fillStyle = ring;
  x.beginPath(); x.ellipse(cx, cy, rx + 34, ry + 34, 0, 0, Math.PI * 2); x.fill();
  x.restore();
  x.strokeStyle = '#5a3a08'; x.lineWidth = 6;
  x.beginPath(); x.ellipse(cx, cy, rx + 34, ry + 34, 0, 0, Math.PI * 2); x.stroke();

  // 거울 속 얼굴
  x.save();
  x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.clip();
  x.fillStyle = '#120a22'; x.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  const vw = video.videoWidth, vh = video.videoHeight;
  if (stream && vw) {
    const s = Math.max((rx * 2) / vw, (ry * 2) / vh);
    x.translate(cx, cy); x.scale(-1, 1);
    x.drawImage(video, (-vw * s) / 2, (-vh * s) / 2, vw * s, vh * s);
    x.setTransform(1, 0, 0, 1, 0, 0);
  }
  if (evil) {
    const v = x.createRadialGradient(cx, cy, rx * 0.5, cx, cy, ry);
    v.addColorStop(0, 'rgba(255,30,60,0)'); v.addColorStop(1, 'rgba(255,30,60,.6)');
    x.fillStyle = v; x.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  }
  const shine = x.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry);
  shine.addColorStop(0.3, 'rgba(255,255,255,0)'); shine.addColorStop(0.44, 'rgba(255,255,255,.14)'); shine.addColorStop(0.56, 'rgba(255,255,255,0)');
  x.fillStyle = shine; x.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  x.restore();
  x.strokeStyle = '#5a3a08'; x.lineWidth = 8;
  x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.stroke();

  // 정답
  x.fillStyle = evil ? '#ff5a74' : '#f5cf62';
  x.shadowColor = evil ? 'rgba(255,59,92,.6)' : 'rgba(230,184,74,.6)';
  x.shadowBlur = 30;
  fitFont(x, q.answer, 800, '"Nanum Myeongjo", serif', 92, W - 120);
  x.fillText(q.answer, W / 2, 1265);
  x.shadowBlur = 0;
  x.fillStyle = '#b9a6d6';
  fitFont(x, q.sub, 500, '"Pretendard Variable", sans-serif', 38, W - 120);
  x.fillText(q.sub, W / 2, 1330);

  // 도파# 서명
  x.fillStyle = '#D9FF44';
  x.font = 'italic 900 30px "Pretendard Variable", sans-serif';
  x.fillText('D#', W / 2 - 170, 1400);
  x.fillStyle = 'rgba(247,246,242,.7)';
  x.font = '700 22px "Pretendard Variable", sans-serif';
  x.fillText('dopa.shap · TRUTH MIRROR', W / 2 + 20, 1401);

  return new Promise((r) => c.toBlob(r, 'image/png'));
}
